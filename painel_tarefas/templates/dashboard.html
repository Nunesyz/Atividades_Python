{% extends 'base.html' %}
{% block conteudo %}
<div class="alert alert-info">
    <i class="bi bi-quote"></i> {{ frase }}
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Minhas Tarefas</h3>
    <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            Filtrar por status
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-status="todas">Todas</a></li>
            <li><a class="dropdown-item" href="#" data-status="Pendente">Pendente</a></li>
            <li><a class="dropdown-item" href="#" data-status="Em andamento">Em andamento</a></li>
            <li><a class="dropdown-item" href="#" data-status="Concluída">Concluída</a></li>
        </ul>
    </div>
</div>

<div id="listaTarefas" class="row g-3">
    {% for tarefa in tarefas %}
    <div class="col-md-4">
        <div class="card
            {% if tarefa.status == 'Pendente' %}tarefa-pendente
            {% elif tarefa.status == 'Em andamento' %}tarefa-andamento
            {% elif tarefa.status == 'Concluída' %}tarefa-concluida
            {% endif %}">
            <div class="card-body">
                <h5 class="card-title">{{ tarefa.titulo }}</h5>
                <p class="card-text">{{ tarefa.descricao }}</p>
                <span class="badge bg-secondary">{{ tarefa.status }}</span>
                <div class="mt-3">
                    <a href="{{ url_for('editar', id=tarefa.id) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <a href="{{ url_for('concluir', id=tarefa.id) }}" class="btn btn-sm btn-outline-success"><i class="bi bi-check-lg"></i></a>
                    <a href="{{ url_for('excluir', id=tarefa.id) }}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/filtro.js') }}"></script>
{% endblock %}
